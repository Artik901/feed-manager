{% extends "layout.html" %}

{% block content %}

<div class="login-page">


    <div class="login-card">


        <div class="login-logo">

            🚀

        </div>


        <h1>
            Вход в Feed Manager
        </h1>


        <p class="login-subtitle">

            {{ shop_name }}

        </p>



        <form method="post">



            <div class="form-group">


                <label>
                    👤 Логин
                </label>


                <input
                type="text"
                name="username"
                placeholder="Введите логин"
                autocomplete="username"
                required
                >


            </div>





            <div class="form-group">


                <label>
                    🔑 Пароль
                </label>


                <input
                type="password"
                name="password"
                placeholder="Введите пароль"
                autocomplete="current-password"
                required
                >


            </div>




            <button class="login-button">

                Войти

            </button>



        </form>



        <div class="login-footer">

            Feed Manager
            <br>
            v{{ app_version }}

        </div>



    </div>


</div>


{% endblock %}
